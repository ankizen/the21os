[project]
name = "the21secrets-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "facebook-business>=26.0.0",
    "fastapi>=0.141.1",
    "google-analytics-admin>=0.30.1",
    "google-analytics-data>=0.23.0",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.15.0",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "B008", # Depends(...) in argument defaults is FastAPI's intended DI pattern
]

[tool.ruff.lint.per-file-ignores]
"the21secrets/api/root.py" = ["E501"] # inline HTML template, not code to wrap

[tool.pytest.ini_options]
asyncio_mode = "auto"
